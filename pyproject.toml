[project]
name = "marketdesk"
version = "0.1.0"
description = "Self-hosted stock watchlist and portfolio tracker"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  # Alembic runs synchronously and cannot use the asyncpg driver - a bare
  # postgresql:// URL makes SQLAlchemy reach for psycopg2, which isn't a
  # dependency. Same lesson learned the hard way in fantasy-edge.
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "greenlet>=3.1",
  "apscheduler>=3.10,<4.0",
  "httpx>=0.28",
  "structlog>=24.4",
  "yfinance>=0.2.43",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
