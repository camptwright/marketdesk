name: marketdesk

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: markets
      POSTGRES_USER: markets
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markets -d markets"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://markets:${POSTGRES_PASSWORD}@postgres:5432/markets"
      API_BEARER_TOKEN: "${API_BEARER_TOKEN:?set API_BEARER_TOKEN}"
    depends_on:
      migrate: {condition: service_completed_successfully}
    expose: ["8000"]
    restart: unless-stopped
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: {DATABASE_URL: "postgresql+asyncpg://markets:${POSTGRES_PASSWORD}@postgres:5432/markets"}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    command: ["tunnel", "--no-autoupdate", "run"]
    environment: {TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}"}
    depends_on: [app]
    restart: unless-stopped
volumes:
  postgres:
