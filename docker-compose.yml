name: marketdesk

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: markets
      POSTGRES_USER: markets
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markets -d markets"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://markets:${POSTGRES_PASSWORD}@postgres:5432/markets"
      API_BEARER_TOKEN: "${API_BEARER_TOKEN:?set API_BEARER_TOKEN}"
    depends_on:
      migrate: {condition: service_completed_successfully}
    expose: ["8000"]
    restart: unless-stopped
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: {DATABASE_URL: "postgresql+asyncpg://markets:${POSTGRES_PASSWORD}@postgres:5432/markets"}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
volumes:
  postgres:
